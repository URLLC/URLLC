[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-pgc-cleaner"
version = "0.1.0"
description = "Clean and normalize travel PGC content from CSV or Excel batches."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
travel-pgc-cleaner = "travel_pgc_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
